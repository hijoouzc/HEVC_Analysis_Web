<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261109" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20261109" />
    <link rel="shortcut icon" href="/favicon.ico?v=20261109" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261109" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEVC Intra Prediction Analyzer</title>
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('apple_theme');
          const isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
