<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Apple Tahoe Blue to Deep Cobalt -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#004FB8"/>
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for CTU Grid -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#001F54" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Apple-style Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="30" rx="14" ry="14" fill="url(#topGloss)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" ry="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- HEVC CTU Quadtree Grid Structure -->
  <g transform="translate(11, 11)" filter="url(#shadow)">
    <!-- CTU 64x64 Base Container (42x42px inside icon) -->
    <rect x="0" y="0" width="42" height="42" rx="3.5" ry="3.5" fill="rgba(3, 18, 48, 0.45)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Depth 1: Top-Left (20x20) solid CU block -->
    <rect x="1.5" y="1.5" width="18.5" height="18.5" rx="2" fill="rgba(255, 255, 255, 0.22)"/>

    <!-- Depth 1: Bottom-Left (20x20) CU block -->
    <rect x="1.5" y="22" width="18.5" height="18.5" rx="2" fill="rgba(255, 255, 255, 0.12)"/>

    <!-- Depth 1: Bottom-Right (20x20) CU block with Video Compression Play Glyph -->
    <rect x="22" y="22" width="18.5" height="18.5" rx="2" fill="rgba(255, 255, 255, 0.16)"/>
    <path d="M 28.5 26.5 L 35.5 31.25 L 28.5 36 Z" fill="#FFFFFF" opacity="0.95"/>

    <!-- Depth 1: Top-Right (20x20) Recursive Quadtree Subdivision! -->
    <!-- Depth 2: Sub-block 0 (TL of TR) -->
    <rect x="22" y="1.5" width="8.5" height="8.5" rx="1" fill="rgba(255, 255, 255, 0.3)"/>
    <!-- Depth 2: Sub-block 1 (TR of TR) -->
    <rect x="32" y="1.5" width="8.5" height="8.5" rx="1" fill="#38BDF8"/>
    <!-- Depth 2: Sub-block 2 (BL of TR) -->
    <rect x="22" y="11.5" width="8.5" height="8.5" rx="1" fill="rgba(255, 255, 255, 0.2)"/>

    <!-- Depth 3: Sub-block 3 (BR of TR) 8x8 units partitioned into 4 RDO mode colors -->
    <rect x="32" y="11.5" width="4" height="4" rx="0.6" fill="#FACC15"/>
    <rect x="36.5" y="11.5" width="4" height="4" rx="0.6" fill="#38BDF8"/>
    <rect x="32" y="16" width="4" height="4" rx="0.6" fill="#34C759"/>
    <rect x="36.5" y="16" width="4" height="4" rx="0.6" fill="#FF453A"/>

    <!-- Primary Quadtree Grid Lines (Crosshair at 21, 21) -->
    <line x1="21" y1="0" x2="21" y2="42" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="21" x2="42" y2="21" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Secondary Quadtree Grid Lines for Top-Right (Crosshair at 31.5, 11) -->
    <line x1="31.5" y1="0" x2="31.5" y2="21" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="21" y1="11" x2="42" y2="11" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>
</svg>
